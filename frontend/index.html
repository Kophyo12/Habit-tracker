<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My habits</h1>
        <button id="add-habit-btn">
            +Add Habit
        </button>
    <div id="habit-form">
        <input
            type="text"
            id="habit-name"
            placeholder="Task For Today"
        >

        <input
            type="text"
            id="habit-description"
            placeholder="Description"
        >

        <button id="create-habit-btn">
            Create habit
        </button>

    </div>

     <div id="habit-list"></div>
    
    </div>
    
    <script src="script.js"></script>
</body>
</html>
