<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Habit Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- ========================= -->
    <!-- TOP BAR -->
    <!-- ========================= -->

    <header class="topbar">

        <div class="title-area">

            <h1>HABIT TRACKER</h1>

            <p id="today-date"></p>

        </div>


        <div class="month-controls">

            <button id="previous-month">
                &lt;
            </button>

            <span id="current-month"></span>

            <button id="next-month">
                &gt;
            </button>

        </div>

    </header>


    <!-- ========================= -->
    <!-- HABITS -->
    <!-- ========================= -->

    <section class="tracker-section">

        <div id="habit-tracker"></div>

    </section>


    <!-- ========================= -->
    <!-- PROGRESS -->
    <!-- ========================= -->

    <section class="progress-section">

        <h2>PROGRESS</h2>

        <div id="github-grid"></div>

    </section>


    <!-- ========================= -->
    <!-- CREATE / EDIT FORM -->
    <!-- ========================= -->

    <div id="habit-form">

        <input
            type="text"
            id="habit-name"
            placeholder="Habit name"
        >

        <input
            type="text"
            id="habit-description"
            placeholder="Description"
        >

        <button id="create-habit-btn">
            Add Habit
        </button>

        <button id="cancel-habit-btn" type="button">
            Cancel
        </button>

        <p id="habit-message" role="alert"></p>

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
